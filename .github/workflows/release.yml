name: Release & Build Windows NSIS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Prepare Kokoro TTS neural models
        run: node scripts/prepare-models.mjs

      - name: Build application bundle (Vite + Electron)
        run: npx vite build

      - name: Build and Publish Electron App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Ensure release is published publicly
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/vnd.github.v3+json"
          }
          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          Write-Host "Vérification du statut public de la release pour le tag $tag..."
          $allReleases = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Headers $headers
          $rel = $allReleases | Where-Object { $_.tag_name -eq $tag }
          if ($rel -and $rel.draft) {
            Write-Host "Passage de la release $($rel.id) du statut draft au statut public..."
            Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -Headers $headers -Method Patch -Body '{"draft":false}' -ContentType "application/json"
            Write-Host "Release publiee publiquement avec succes !"
          } else {
            Write-Host "La release est deja publique."
          }
